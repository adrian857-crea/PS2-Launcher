
name: PS2 Launcher - Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'modules/**'
      - 'Makefile'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Compile PS2 Launcher
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2homebrew/ps2homebrew:main

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check PS2SDK
        run: |
          echo "Checking PS2SDK..."
          test -n "$PS2SDK"
          test -d "$PS2SDK"
          echo "PS2SDK found: $PS2SDK"
          make --version

      - name: Compile project
        run: |
          make --trace NOT_PACKED=1

      - name: Verify ELF
        run: |
          test -s opl.elf
          file opl.elf
          ls -lh opl.elf

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Launcher-Evolution-ELF
          path: opl.elf
          if-no-files-found: error
          retention-days: 14
